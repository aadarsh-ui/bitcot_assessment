name: Deploy Development
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/oidc-claims-debug')
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          APP_SUBNET_A_ID: ${{ vars.APP_SUBNET_A_ID }}
          APP_SUBNET_B_ID: ${{ vars.APP_SUBNET_B_ID }}
          LAMBDA_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
          DATABASE_ENDPOINT: ${{ vars.DATABASE_ENDPOINT }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
          ECS_MIGRATION_TASK_DEFINITION_FAMILY: ${{ vars.ECS_MIGRATION_TASK_DEFINITION_FAMILY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_SECURITY_GROUP_ID: ${{ vars.ECS_SECURITY_GROUP_ID }}
          GRAPHQL_HTTP_URL: ${{ vars.GRAPHQL_HTTP_URL }}
          GRAPHQL_WS_URL: ${{ vars.GRAPHQL_WS_URL }}
          COGNITO_ISSUER: ${{ vars.COGNITO_ISSUER }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
          COGNITO_LOGOUT_URI: ${{ vars.COGNITO_LOGOUT_URI }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$AWS_DEPLOY_ROLE_ARN" ]] && missing+=(AWS_DEPLOY_ROLE_ARN)
          [[ -z "$CLOUDFORMATION_EXECUTION_ROLE_ARN" ]] && missing+=(CLOUDFORMATION_EXECUTION_ROLE_ARN)
          [[ -z "$SAM_ARTIFACT_BUCKET" ]] && missing+=(SAM_ARTIFACT_BUCKET)
          [[ -z "$APP_SUBNET_A_ID" ]] && missing+=(APP_SUBNET_A_ID)
          [[ -z "$APP_SUBNET_B_ID" ]] && missing+=(APP_SUBNET_B_ID)
          [[ -z "$LAMBDA_SECURITY_GROUP_ID" ]] && missing+=(LAMBDA_SECURITY_GROUP_ID)
          [[ -z "$DATABASE_SECRET_ARN" ]] && missing+=(DATABASE_SECRET_ARN)
          [[ -z "$DATABASE_ENDPOINT" ]] && missing+=(DATABASE_ENDPOINT)
          [[ -z "$ECR_REPOSITORY_URL" ]] && missing+=(ECR_REPOSITORY_URL)
          [[ -z "$ECS_TASK_DEFINITION_FAMILY" ]] && missing+=(ECS_TASK_DEFINITION_FAMILY)
          [[ -z "$ECS_MIGRATION_TASK_DEFINITION_FAMILY" ]] && missing+=(ECS_MIGRATION_TASK_DEFINITION_FAMILY)
          [[ -z "$ECS_CLUSTER" ]] && missing+=(ECS_CLUSTER)
          [[ -z "$ECS_SERVICE" ]] && missing+=(ECS_SERVICE)
          [[ -z "$ECS_SECURITY_GROUP_ID" ]] && missing+=(ECS_SECURITY_GROUP_ID)
          [[ -z "$GRAPHQL_HTTP_URL" ]] && missing+=(GRAPHQL_HTTP_URL)
          [[ -z "$GRAPHQL_WS_URL" ]] && missing+=(GRAPHQL_WS_URL)
          [[ -z "$COGNITO_ISSUER" ]] && missing+=(COGNITO_ISSUER)
          [[ -z "$COGNITO_CLIENT_ID" ]] && missing+=(COGNITO_CLIENT_ID)
          [[ -z "$COGNITO_REDIRECT_URI" ]] && missing+=(COGNITO_REDIRECT_URI)
          [[ -z "$COGNITO_LOGOUT_URI" ]] && missing+=(COGNITO_LOGOUT_URI)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Diagnose OIDC claims (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = token.split('.')[1];
            if (!payload) {
              throw new Error('GitHub returned an invalid OIDC token');
            }
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }));
            core.setFailed('Temporary diagnostic only: stop before AWS authentication.');
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: graphql-dev-deploy-${{ github.run_id }}
      - run: aws sts get-caller-identity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run generate --workspace database/prisma && npm run build --workspace lambdas
      - uses: aws-actions/setup-sam@v2
      - run: cd lambdas && sam validate --lint --template-file template.yaml && sam build --template-file template.yaml
      - run: aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-south-1.amazonaws.com
      - name: Build and push backend image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --provenance=true --tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" -f backend/Dockerfile .
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - name: Run database migrations in private ECS task
        env:
          IMAGE_URI: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          MIGRATION_TASK_DEFINITION_FAMILY: ${{ vars.ECS_MIGRATION_TASK_DEFINITION_FAMILY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          APP_SUBNET_A_ID: ${{ vars.APP_SUBNET_A_ID }}
          APP_SUBNET_B_ID: ${{ vars.APP_SUBNET_B_ID }}
          ECS_SECURITY_GROUP_ID: ${{ vars.ECS_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json | jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image=$IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEFINITION" \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          TASK_RESPONSE=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$APP_SUBNET_A_ID,$APP_SUBNET_B_ID],securityGroups=[$ECS_SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --region ap-south-1 \
            --output json)
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<< "$TASK_RESPONSE")
          if [[ -z "$TASK_ARN" ]]; then
            jq -r '.failures[]? | "Migration task could not start: \(.reason) \(.detail // "")"' <<< "$TASK_RESPONSE" >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region ap-south-1
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --region ap-south-1 \
            --query "tasks[0].containers[?name=='db-migrate'].exitCode | [0]" \
            --output text)
          if [[ "$EXIT_CODE" != "0" ]]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --region ap-south-1 \
              --query 'tasks[0].[stoppedReason,containers[0].reason]' --output text >&2
            echo "Database migration task failed with exit code: $EXIT_CODE" >&2
            exit 1
          fi
      - name: Deploy SAM functions
        working-directory: lambdas
        env:
          PRIVATE_SUBNET_A: ${{ vars.APP_SUBNET_A_ID }}
          PRIVATE_SUBNET_B: ${{ vars.APP_SUBNET_B_ID }}
          LAMBDA_SECURITY_GROUP: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
          DATABASE_ENDPOINT: ${{ vars.DATABASE_ENDPOINT }}
          JWT_ISSUER: ${{ vars.COGNITO_ISSUER }}
          JWT_AUDIENCE: ${{ vars.COGNITO_CLIENT_ID }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          sam deploy --template-file .aws-sam/build/template.yaml \
            --stack-name graphql-serverless-dev \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --no-confirm-changeset \
            --parameter-overrides \
              Environment=dev \
              PrivateSubnetA="$PRIVATE_SUBNET_A" \
              PrivateSubnetB="$PRIVATE_SUBNET_B" \
              LambdaSecurityGroup="$LAMBDA_SECURITY_GROUP" \
              DatabaseSecretArn="$DATABASE_SECRET_ARN" \
              DatabaseEndpoint="$DATABASE_ENDPOINT" \
              JwtIssuer="$JWT_ISSUER" \
              JwtAudience="$JWT_AUDIENCE"
      - name: Register immutable task revision
        env:
          IMAGE_URI: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json | jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image=$IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEFINITION" \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region ap-south-1
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region ap-south-1
      - name: Build and deploy frontend
        if: ${{ vars.FRONTEND_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          VITE_GRAPHQL_HTTP_URL: ${{ vars.GRAPHQL_HTTP_URL }}
          VITE_GRAPHQL_WS_URL: ${{ vars.GRAPHQL_WS_URL }}
          VITE_COGNITO_ISSUER: ${{ vars.COGNITO_ISSUER }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.COGNITO_LOGOUT_URI }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          npm run build --workspace frontend
          aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html"
      - name: Skip frontend deployment until CloudFront is available
        if: ${{ vars.FRONTEND_BUCKET == '' || vars.CLOUDFRONT_DISTRIBUTION_ID == '' }}
        run: echo "Frontend deployment skipped; configure FRONTEND_BUCKET and CLOUDFRONT_DISTRIBUTION_ID after CloudFront is available."

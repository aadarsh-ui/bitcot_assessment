name: Terraform Plan
on:
  pull_request:
    paths: ["infrastructure/terraform/**"]
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.0 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform -chdir=infrastructure/terraform/environments/dev init -backend=false
      - run: terraform -chdir=infrastructure/terraform/environments/dev fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform/environments/dev validate
      - run: terraform -chdir=infrastructure/terraform/environments/dev plan -out=tfplan
